name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac --arm64
            artifact: macOS-arm64
          - os: macos-15-intel
            target: --mac --x64
            artifact: macOS-x64
          - os: windows-latest
            target: --win --x64
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer without publishing
        run: npm run desktop:build -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: muz-ms-agent-${{ matrix.artifact }}
          path: |
            dist-desktop/release/*.dmg
            dist-desktop/release/*.zip
            dist-desktop/release/*.exe
          if-no-files-found: error
