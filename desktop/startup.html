<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>muz-ms-agent</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fa; color: #20252c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px; }
    .mark { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 24px; border-radius: 16px; background: #2563eb; color: white; font-size: 25px; font-weight: 700; }
    h1 { margin: 0 0 12px; font-size: 24px; font-weight: 650; letter-spacing: -.4px; }
    p { margin: 0; color: #68727d; font-size: 14px; line-height: 1.8; }
    .progress { width: 160px; height: 3px; overflow: hidden; margin: 28px 0 18px; border-radius: 3px; background: #e3e9e6; }
    .progress::after { content: ''; display: block; width: 45%; height: 100%; border-radius: 3px; background: #2563eb; animation: move 1.3s ease-in-out infinite alternate; }
    @keyframes move { to { transform: translateX(125%); } }
    @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; margin: auto; } }
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">m.</div><h1>muz-ms-agent</h1><p>正在准备你的面试练习空间</p><div class="progress" role="progressbar" aria-label="正在启动应用"></div><p>启动本地服务后会自动进入应用。</p></main></body>
</html>
